[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-diff-general"
version = "0.1.0"
description = "Task-conditioned generation of classifier parameters across problems"
requires-python = ">=3.11"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdiff-general-smoke = "p_diff_general.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
